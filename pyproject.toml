[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "production-rag"
version = "0.4.0"
description = "Retrieval-augmented generation service with hybrid search, reranking, grounded citations and an evaluation harness."
readme = "README.md"
license = "MIT"
authors = [{ name = "Markus N." }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "pypdf>=4.2",
  "beautifulsoup4>=4.12",
  "psycopg[binary,pool]>=3.1",
  "openai>=1.30",
  "anthropic>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/production_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: requires a running Postgres with pgvector (set RAG_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "evals/"]
